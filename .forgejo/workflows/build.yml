# Build Immich's derived Postgres image and push it to the estate's own registry (Forgejo's), so the
# build no longer depends on GitHub's hosted runners or ghcr.io.
#
# Same shape as bakuran-gitops' checks-image.yml: buildah (no Docker daemon in the runner), vfs storage
# driver (no privileges), push by digest. The tag stays `14.19` - CNPG parses it to judge major-version
# upgrades and rejects a sha or a commit tag ("invalid version tag").
name: build

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: in-cluster
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build, prove initdb as uid 26, and push
        env:
          # write:package token for the `bismigel` user; the run token cannot push packages.
          PKG_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
        run: |
          set -eu
          tag="14.19"   # CNPG reads this; never change it to a commit sha
          {
            export BUILDAH_ISOLATION=chroot TMPDIR=/var/lib/containers/tmp
            mkdir -p "$TMPDIR"

            echo "$PKG_TOKEN" | buildah --storage-driver vfs login \
              --tls-verify=false --username bismigel --password-stdin forgejo.forgejo.svc:3000

            buildah --storage-driver vfs bud -q --format oci -t "immich-pg:${tag}" -f Dockerfile .

            # The image is only useful if initdb runs at the uid CNPG uses (26). Building is not that test.
            ctr=$(buildah --storage-driver vfs from "immich-pg:${tag}")
            buildah --storage-driver vfs run --user 26 "$ctr" -- sh -c '
              getent passwd 26
              mkdir -p /tmp/pg
              /usr/lib/postgresql/14/bin/initdb -D /tmp/pg --auth=trust >/dev/null
              ls /usr/lib/postgresql/14/lib/ | grep -q "^vchord.so$"
              ls /usr/lib/postgresql/14/lib/ | grep -q "^vector.so$"
              echo "initdb ok, extensions present"'
            buildah --storage-driver vfs rm "$ctr"

            buildah --storage-driver vfs push --format oci --tls-verify=false --digestfile /tmp/pushed.digest \
              "immich-pg:${tag}" "forgejo.forgejo.svc:3000/bismigel/immich-pg:${tag}"
          } > /tmp/push.log 2>&1 || { echo "build/push failed:"; tail -25 /tmp/push.log; exit 1; }

          echo "pushed bismigel/immich-pg:${tag} digest=$(cat /tmp/pushed.digest)"
          echo "digest $(cat /tmp/pushed.digest)" >> "$GITHUB_STEP_SUMMARY"
