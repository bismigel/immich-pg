name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Base reference
        id: base
        run: |
          base=$(grep -oP '^ARG BASE=\K.*' Dockerfile)
          echo "ref=$base" >> "$GITHUB_OUTPUT"
          echo "tag=immich-pg:test" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build (and prove initdb works as uid 26)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: immich-pg:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image is only useful if initdb runs at the uid CNPG uses. Building is not that test.
      - name: initdb must succeed as uid 26
        run: |
          docker run --rm --user 26 immich-pg:test sh -c '
            getent passwd 26
            mkdir -p /tmp/pg
            /usr/lib/postgresql/14/bin/initdb -D /tmp/pg --auth=trust >/dev/null
            ls /usr/lib/postgresql/14/lib/ | grep -q "^vchord.so$"
            ls /usr/lib/postgresql/14/lib/ | grep -q "^vector.so$"
            echo "initdb ok, extensions present"'

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # The tag is the Postgres version, not `latest` or a commit sha: CloudNativePG parses `imageName`'s tag
          # to decide whether an update is within the same major version, and rejects tags it cannot read
          # ("invalid version tag"). The digest is what actually decides what runs (ADR 0007).
          tags: |
            ghcr.io/${{ github.repository }}:14.19
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          echo "digest: ${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Use by digest (ADR 0007): ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
